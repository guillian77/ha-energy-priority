<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800" role="img" aria-label="Principe de fonctionnement d'Energy Priority">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#14213A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B6382"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1440" height="800" rx="24" fill="url(#bg)"/>

  <text x="56" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#E6EDF7">Energy Priority</text>
  <text x="56" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#8FA3BF">Principe de fonctionnement — un cycle toutes les 10 s</text>

  <!-- Colonne 1 : entrées -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="60" y="140" font-size="13" font-weight="700" fill="#6C82A1" letter-spacing="2">ENTRÉES</text>

    <rect x="40" y="156" width="250" height="84" rx="14" fill="#141E33" stroke="#243350"/>
    <text x="64" y="188" font-size="15" fill="#9FB0C9">☀  Puissance solaire</text>
    <text x="64" y="216" font-size="20" font-weight="700" fill="#E6EDF7">1 800 W</text>

    <rect x="40" y="252" width="250" height="84" rx="14" fill="#141E33" stroke="#243350"/>
    <text x="64" y="284" font-size="15" fill="#9FB0C9">⌂  Consommation globale</text>
    <text x="64" y="312" font-size="20" font-weight="700" fill="#E6EDF7">1 500 W</text>

    <rect x="40" y="348" width="250" height="84" rx="14" fill="#141E33" stroke="#243350"/>
    <text x="64" y="380" font-size="15" fill="#9FB0C9">▮  Batterie · SOC</text>
    <text x="64" y="408" font-size="20" font-weight="700" fill="#E6EDF7">−400 W · 65 %</text>

    <rect x="40" y="444" width="250" height="84" rx="14" fill="#141E33" stroke="#243350"/>
    <text x="64" y="476" font-size="15" fill="#9FB0C9">◷  Tarif</text>
    <text x="64" y="504" font-size="20" font-weight="700" fill="#38BDF8">HC</text>
    <text x="122" y="504" font-size="14" fill="#6C82A1">ou HP</text>
  </g>

  <!-- flèche 1 -->
  <path d="M 296 372 L 330 372" stroke="#4B6382" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Colonne 2 : calcul -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="348" y="140" font-size="13" font-weight="700" fill="#6C82A1" letter-spacing="2">CALCUL</text>

    <rect x="340" y="156" width="330" height="372" rx="16" fill="#141E33" stroke="#243350" filter="url(#soft)"/>

    <text x="364" y="196" font-size="15" font-weight="700" fill="#E6EDF7">1 · Charge de base</text>
    <text x="364" y="222" font-size="14" fill="#9FB0C9">consommation globale</text>
    <text x="364" y="244" font-size="14" fill="#9FB0C9">− Σ puissance des appareils</text>
    <text x="364" y="266" font-size="14" fill="#9FB0C9">   pilotés actuellement allumés</text>

    <line x1="364" y1="292" x2="646" y2="292" stroke="#243350" stroke-width="1.5"/>

    <text x="364" y="326" font-size="15" font-weight="700" fill="#E6EDF7">2 · Décharge autorisée</text>
    <text x="364" y="352" font-size="14" fill="#9FB0C9">0 si SOC &lt; seuil mini,</text>
    <text x="364" y="374" font-size="14" fill="#9FB0C9">sinon min(plafond, mesurée)</text>

    <line x1="364" y1="400" x2="646" y2="400" stroke="#243350" stroke-width="1.5"/>

    <rect x="360" y="418" width="290" height="86" rx="12" fill="#1B2740" stroke="#3B4F70"/>
    <text x="376" y="446" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="1">BUDGET</text>
    <text x="376" y="472" font-size="14" fill="#E6EDF7">solaire + décharge − base</text>
    <text x="376" y="492" font-size="14" fill="#E6EDF7">− marge de sécurité</text>
  </g>

  <!-- flèche 2 -->
  <path d="M 676 372 L 710 372" stroke="#4B6382" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Colonne 3 : arbitrage -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="718" y="140" font-size="13" font-weight="700" fill="#6C82A1" letter-spacing="2">ORDRE DE SERVICE</text>

    <rect x="710" y="156" width="330" height="120" rx="16" fill="#2A2113" stroke="#6B4E17"/>
    <circle cx="742" cy="192" r="15" fill="url(#amber)"/>
    <text x="742" y="197" font-size="15" font-weight="700" fill="#231803" text-anchor="middle">1</text>
    <text x="770" y="198" font-size="16" font-weight="700" fill="#FFD79A">Quota + heures creuses</text>
    <text x="742" y="228" font-size="14" fill="#C9A96A">forçage continu, sans rotation</text>
    <text x="742" y="250" font-size="14" fill="#C9A96A">ni durée minimale, jusqu'au quota</text>

    <rect x="710" y="292" width="330" height="104" rx="16" fill="#141E33" stroke="#243350"/>
    <circle cx="742" cy="328" r="15" fill="#243350"/>
    <text x="742" y="333" font-size="15" font-weight="700" fill="#9FB0C9" text-anchor="middle">2</text>
    <text x="770" y="334" font-size="16" font-weight="700" fill="#E6EDF7">Priorité</text>
    <text x="742" y="364" font-size="14" fill="#9FB0C9">1 = le plus critique (clim avant</text>
    <text x="742" y="384" font-size="14" fill="#9FB0C9">ballon)</text>

    <rect x="710" y="412" width="330" height="116" rx="16" fill="#141E33" stroke="#243350"/>
    <circle cx="742" cy="448" r="15" fill="#243350"/>
    <text x="742" y="453" font-size="15" font-weight="700" fill="#9FB0C9" text-anchor="middle">3</text>
    <text x="770" y="454" font-size="16" font-weight="700" fill="#E6EDF7">Rotation équitable</text>
    <text x="742" y="484" font-size="14" fill="#9FB0C9">le moins servi sur 24 h glissantes</text>
    <text x="742" y="504" font-size="14" fill="#9FB0C9">passe d'abord, à priorité égale</text>
  </g>

  <!-- flèche 3 -->
  <path d="M 1046 372 L 1080 372" stroke="#4B6382" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Colonne 4 : application -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="1088" y="140" font-size="13" font-weight="700" fill="#6C82A1" letter-spacing="2">APPLICATION</text>

    <rect x="1080" y="156" width="320" height="372" rx="16" fill="#141E33" stroke="#243350" filter="url(#soft)"/>

    <text x="1104" y="196" font-size="15" font-weight="700" fill="#E6EDF7">Allumer / éteindre</text>
    <text x="1104" y="222" font-size="14" fill="#9FB0C9">si le cumul tient dans le budget</text>
    <text x="1104" y="244" font-size="14" fill="#9FB0C9">coupure si budget − hystérésis</text>

    <line x1="1104" y1="268" x2="1376" y2="268" stroke="#243350" stroke-width="1.5"/>

    <text x="1104" y="300" font-size="15" font-weight="700" fill="#E6EDF7">Garde-fous</text>
    <text x="1104" y="326" font-size="14" fill="#9FB0C9">• durée min de marche / d'arrêt</text>
    <text x="1104" y="348" font-size="14" fill="#9FB0C9">• 30 s de stabilisation</text>
    <text x="1104" y="370" font-size="14" fill="#9FB0C9">• capteur absent → arrêt sécurité</text>

    <line x1="1104" y1="394" x2="1376" y2="394" stroke="#243350" stroke-width="1.5"/>

    <text x="1104" y="426" font-size="15" font-weight="700" fill="#E6EDF7">Résultat</text>
    <text x="1104" y="452" font-size="14" fill="#34D399">clim 1 200 W → allumée</text>
    <text x="1104" y="474" font-size="14" fill="#8FA3BF">ballon 2 200 W → en attente</text>
    <text x="1104" y="496" font-size="13" fill="#6C82A1">raison lisible par appareil</text>
  </g>

  <!-- boucle de rétroaction -->
  <path d="M 1240 528 L 1240 620 L 505 620 L 505 528" stroke="#4B6382" stroke-width="2.5" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <rect x="700" y="602" width="340" height="36" rx="18" fill="#0F1728" stroke="#243350"/>
  <text x="870" y="626" font-size="14" fill="#8FA3BF" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">la mesure réelle recalcule le budget → 10 s</text>

  <!-- note bas de page -->
  <rect x="40" y="684" width="1360" height="72" rx="16" fill="#0F1728" stroke="#243350"/>
  <text x="68" y="714" font-size="14" fill="#9FB0C9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">En heures pleines, un appareil en retard de quota reste soumis au budget : il attend un surplus ou se rattrape la nuit.</text>
  <text x="68" y="738" font-size="14" fill="#9FB0C9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Toutes les valeurs (marge, hystérésis, quotas, durées, seuil SOC) sont configurables ; les chiffres ci-dessus sont un exemple.</text>
</svg>
